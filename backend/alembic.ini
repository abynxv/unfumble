# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# The database URL — overridden by env.py to use the app config.
# We replace asyncpg with psycopg2 for Alembic because Alembic runs
# migrations synchronously.
sqlalchemy.url = postgresql://localhost/unfumble

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
